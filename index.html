<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Word Sniper風ゲーム</title>
  <!-- Google Fontsでモダンなフォントを導入 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Word Sniper風ゲーム</h1>

  <!-- カード風デザインのラッパーを追加 -->
  <div class="card" id="start-screen">
    <label>プレイヤー人数: 
      <select id="player-count">
        <option value="2" selected>2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>
    </label>
    <div id="player-names"></div> <!-- 名前入力欄のコンテナ -->
    <button id="start-button">ゲーム開始</button>
  </div>

  <div class="card" id="game-screen" style="display:none;">
    <p>ジャンル：<span id="genre">---</span></p>
    <p>文字：<span id="letters">---</span></p>

    <h2>得点</h2>
    <ul id="score-list"></ul>

    <h3>得点を加算するプレイヤーを選んでください</h3>
    <form id="answer-form"></form>

    <button id="next-prompt">次のお題</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
